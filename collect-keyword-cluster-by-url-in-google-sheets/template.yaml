name: Keyword Cluster by URL
slug: collect-keyword-cluster-by-url-in-google-sheets
summary: >-
  Every two weeks, takes a list of URLs from an input sheet and, for each one,
  pulls the full set of keywords that URL ranks for into its own tab of an
  output spreadsheet - keyword, position, volume, difficulty, CPC, competition,
  intent, SERP feature type and estimated traffic.
