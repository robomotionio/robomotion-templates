name: Webhook Screenshot Service
slug: webhook-screenshot-service
summary: >-
  A flow that waits to be called. Http In gives it a public URL that Robomotion
  hosts for you, with no port to open and no tunnel to run, and Http Out answers
  on the same held-open request. Between the two, the robot does what a web
  service cannot do for itself: it opens a real browser, loads the page it was
  asked about, waits three seconds for it to settle, and photographs it. The
  reply is the PNG, attached to the response, so curl -o shot.png is a complete
  client and nothing about the caller needs to know what Robomotion is.
category: Networking
level: Intermediate
