name: API Calls with Http Request
slug: api-calls-with-http-request
summary: >-
  Three HTTP calls, one node. A plain read of a public exchange rate service, the
  same call behind a password, and a call that carries a file. They differ only
  in their properties, which is the point: authentication is a property and not a
  different node, and neither is a multipart body. Basic Authentication takes a
  vault item and nothing else, so no password is written into the flow, and an
  at-sign in front of a path is what makes the node open that file and send it as
  a form part, exactly the way curl does it.
category: Networking
level: Intermediate
