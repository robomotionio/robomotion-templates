slug: get-business-data-for-pipedrive-leads
summary: >-
  Every 15 minutes, takes the leads Pipedrive has touched most recently, turns
  each website into a bare domain, looks the company up in the Google Business
  listings database, and writes the name, description, categories, address,
  rating and price level back onto the Pipedrive record.
