name: AI Mode References to Sheets
slug: pull-references-from-google-ai-mode-to-google-sheets
summary: >-
  Tracks which websites Google's AI Mode cites when it answers a question. Every
  7 days it queries the AI Mode SERP for a keyword, flattens the references of
  every answer block, de-duplicates them by URL and appends them to a Google
  Sheet.
