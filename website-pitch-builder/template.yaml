name: Website Pitch Builder
slug: website-pitch-builder
summary: >-
  Finds a shop that has no website and builds it one. Google Maps is searched
  through the scrape.do API, the listings are filtered down to businesses with a
  phone, enough reviews to prove they have customers, and no real site of their
  own - a Facebook page or a Wix subdomain counts as no site - and the best one
  is scored out. Its opening hours, ten best reviews and four public domain
  photographs are gathered, and a DeepSeek Agent writes a single self-contained
  page from that brief and nothing else. A real browser then photographs the
  page, and the screenshot and a CSV row are mailed to you. Google Maps has no
  email column, so the packet comes to you with the shop's phone number in it,
  and a person makes the call.
category: AI
level: Advanced
