name: Zoho CRM Lead Business Data
slug: get-business-data-for-zoho-crm-leads
summary: >-
  Every 15 minutes, takes the leads Zoho CRM has touched most recently, turns
  each website into a bare domain, looks the company up in the Google Business
  listings database, and writes the name, description, categories, address,
  rating and price level back onto the Zoho CRM record.
