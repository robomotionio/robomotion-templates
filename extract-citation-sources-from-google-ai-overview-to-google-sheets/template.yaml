name: AI Overview Citations to Sheets
slug: extract-citation-sources-from-google-ai-overview-to-google-sheets
summary: >-
  Tracks which websites Google's AI Overview cites for a keyword. Every 7 days
  it pulls the Google SERP with the AI Overview block loaded, collects every
  source the answer references, de-duplicates them by URL and appends them to a
  Google Sheet.
