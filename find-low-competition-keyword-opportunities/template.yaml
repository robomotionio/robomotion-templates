name: Low-Competition Keyword Finder
slug: find-low-competition-keyword-opportunities
summary: >-
  For each seed domain in an input sheet, pulls every keyword the domain is
  relevant for, scores all of them for ranking difficulty in one bulk call, and
  writes the combined picture - volume, trend, difficulty, intent and average
  backlinks - to an opportunities sheet.
