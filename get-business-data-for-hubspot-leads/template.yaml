name: Hubspot Lead Business Data
slug: get-business-data-for-hubspot-leads
summary: >-
  Every 15 minutes, takes the leads HubSpot has touched most recently, turns
  each website into a bare domain, looks the company up in the Google Business
  listings database, and writes the name, description, categories, address,
  rating and price level back onto the HubSpot record.
