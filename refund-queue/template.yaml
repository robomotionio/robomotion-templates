name: Refund Queue
slug: refund-queue
summary: >-
  A work queue with both halves built for real: an intake that puts refund
  requests on a workspace queue one at a time, and a worker loop that takes
  them off, decides each one, and records Successful or Failed against it.
  Items are encrypted with an AES key from your vault before they leave the
  robot, so the Admin Console keeps the history of every item without ever
  being able to read one. Cut a single wire and the two halves become an
  intake you can schedule and a worker you can run on any number of robots.
category: Concurrency
level: Intermediate
tags: [queue, orchestration, encryption, vault, foreach, loop, automation]
