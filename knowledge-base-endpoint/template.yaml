name: Knowledge Base Endpoint
slug: knowledge-base-endpoint
summary: >-
  Ask your own documents a question over HTTP. A Robomotion Knowledge Base is
  indexed by a workspace agent on your machine and searched locally by the
  robot; one Query Knowledge Base node returns the passages that answer a
  question, each with the document and heading it came from. Http In and Http
  Out turn the flow into a service anything can call, and a Min Score fence
  means it answers "I could not find that" instead of inventing something.
  Ships four sample documents and a thirty-line Python client.
category: AI
level: Advanced
