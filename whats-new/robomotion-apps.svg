<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t">
  <title id="t">Robomotion Apps</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a20"/><stop offset="100%" stop-color="#101015"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2a2a31" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.9">
      <stop offset="0%" stop-color="#ff4f00" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ff4f00" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ff4f00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="0.95" r="0.8">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#grid)"/>
  <rect width="960" height="540" fill="url(#glow)"/>
  <rect width="960" height="540" fill="url(#glow2)"/>

  <!-- left copy -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="72" y="118" width="118" height="28" rx="14" fill="#ff4f00" fill-opacity="0.16" stroke="#ff4f00" stroke-opacity="0.5"/>
    <text x="131" y="137" text-anchor="middle" font-size="13" font-weight="600" fill="#ff8a4c" letter-spacing="1.5">NEW</text>
    <text x="72" y="206" font-size="44" font-weight="700" fill="#ffffff">Robomotion</text>
    <text x="72" y="256" font-size="44" font-weight="700" fill="#ff4f00">Apps</text>
    <text x="72" y="304" font-size="17" fill="#a1a1aa">A flow with screens in front of it.</text>
    <text x="72" y="330" font-size="17" fill="#a1a1aa">Built by conversation, run on your robot.</text>
    <g transform="translate(72,372)">
      <rect width="150" height="36" rx="18" fill="#ff4f00"/>
      <text x="75" y="23" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Open in Build</text>
    </g>
  </g>

  <!-- app window -->
  <g transform="translate(470,92)" filter="url(#shadow)">
    <rect width="430" height="370" rx="14" fill="#16161c" stroke="#2f2f38"/>
    <rect width="430" height="34" rx="14" fill="#1e1e26"/>
    <rect y="20" width="430" height="14" fill="#1e1e26"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/><circle cx="38" cy="17" r="5" fill="#f59e0b"/><circle cx="56" cy="17" r="5" fill="#22c55e"/>
    <rect x="150" y="10" width="140" height="14" rx="7" fill="#2a2a33"/>
    <!-- sidebar -->
    <rect x="0" y="34" width="110" height="336" fill="#191920"/>
    <rect x="16" y="56" width="70" height="10" rx="5" fill="#ff4f00"/>
    <rect x="16" y="86" width="78" height="8" rx="4" fill="#3a3a44"/>
    <rect x="16" y="108" width="60" height="8" rx="4" fill="#3a3a44"/>
    <rect x="16" y="130" width="72" height="8" rx="4" fill="#3a3a44"/>
    <rect x="16" y="152" width="50" height="8" rx="4" fill="#3a3a44"/>
    <!-- main -->
    <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
      <text x="132" y="70" font-size="15" font-weight="600" fill="#e4e4e7">Invoice approvals</text>
      <rect x="132" y="86" width="270" height="1" fill="#2a2a33"/>
      <g transform="translate(132,102)">
        <rect width="128" height="64" rx="8" fill="#1e1e26" stroke="#2f2f38"/>
        <text x="12" y="24" font-size="10" fill="#a1a1aa">Waiting</text>
        <text x="12" y="50" font-size="20" font-weight="700" fill="#ffffff">12</text>
      </g>
      <g transform="translate(274,102)">
        <rect width="128" height="64" rx="8" fill="#1e1e26" stroke="#2f2f38"/>
        <text x="12" y="24" font-size="10" fill="#a1a1aa">Approved today</text>
        <text x="12" y="50" font-size="20" font-weight="700" fill="#22c55e">38</text>
      </g>
      <g transform="translate(132,184)">
        <rect width="270" height="40" rx="8" fill="#1e1e26" stroke="#2f2f38"/>
        <rect x="12" y="14" width="110" height="10" rx="5" fill="#3a3a44"/>
        <rect x="190" y="11" width="68" height="18" rx="9" fill="#ff4f00" fill-opacity="0.2" stroke="#ff4f00" stroke-opacity="0.6"/>
        <text x="224" y="24" text-anchor="middle" font-size="10" font-weight="600" fill="#ff8a4c">Approve</text>
      </g>
      <g transform="translate(132,232)">
        <rect width="270" height="40" rx="8" fill="#1e1e26" stroke="#2f2f38"/>
        <rect x="12" y="14" width="140" height="10" rx="5" fill="#3a3a44"/>
        <rect x="190" y="11" width="68" height="18" rx="9" fill="#ff4f00" fill-opacity="0.2" stroke="#ff4f00" stroke-opacity="0.6"/>
        <text x="224" y="24" text-anchor="middle" font-size="10" font-weight="600" fill="#ff8a4c">Approve</text>
      </g>
      <g transform="translate(132,280)">
        <rect width="270" height="40" rx="8" fill="#1e1e26" stroke="#2f2f38"/>
        <rect x="12" y="14" width="90" height="10" rx="5" fill="#3a3a44"/>
        <rect x="190" y="11" width="68" height="18" rx="9" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.5"/>
        <text x="224" y="24" text-anchor="middle" font-size="10" font-weight="600" fill="#4ade80">Done</text>
      </g>
      <!-- robot pill -->
      <g transform="translate(132,334)">
        <circle cx="8" cy="8" r="4" fill="#22c55e"/>
        <text x="20" y="12" font-size="10" fill="#a1a1aa">Running on Application Robot</text>
      </g>
    </g>
  </g>
</svg>
