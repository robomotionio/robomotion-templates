name: Guided Returns Desk
slug: guided-returns-desk
summary: >-
  A guided chat assistant that opens a product return, one question at a time.
  Uses Chat Assistant widget nodes for the questions, checks the order number
  while the customer is still in the conversation, and loops back to the
  question when it does not recognise one instead of throwing an exception.
