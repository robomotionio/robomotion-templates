name: Track Brand Mentions
slug: track-brand-mentions
summary: >-
  Every evening, searches the web for pages that mentioned your brand in the
  last 24 hours, classifies each mention as positive, negative or neutral,
  writes them into a dated Google Doc, and posts a Slack summary with the
  sentiment split and a link to the doc.
